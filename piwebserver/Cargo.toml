[package]
name = "piwebserver"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
serde = { version = "1", features = ["derive"] }
gilrs = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
display-interface = "0.5.0"
embedded-graphics = "0.8.2"
evdev = "0.12"
linux-embedded-hal = "0.4.1"
serialport = { version = "4.9.0", default-features = false }
ssd1306 = "0.10.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
